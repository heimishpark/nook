let lastClickIndex = -1, previousClickRate = 1, clickSerial = 0;
const physicalClickVoices = new Set();
function playPhysicalKeyClick(){
  if (typeof soundOn !== 'undefined' && !soundOn) return;
  let idx = Math.floor(Math.random()*physicalKeyClicks.length);
  if (idx === lastClickIndex) idx = (idx + 1 + Math.floor(Math.random()*(physicalKeyClicks.length-1)))%physicalKeyClicks.length;
  lastClickIndex=idx;
  // Audible, naturally fluctuating pitch, not a fixed loop.
  const pitches=[.88,.94,.98,1.0,1.04,1.09,1.15];
  let rate=pitches[(clickSerial++ + Math.floor(Math.random()*3))%pitches.length];
  if(Math.abs(rate-previousClickRate)<.065) rate=rate<1?1.095:.915;
  previousClickRate=rate;
  const a=new Audio(physicalKeyClicks[idx]);
  a.preload='auto';
  a.playbackRate=rate;
  a.preservesPitch=false;
  a.mozPreservesPitch=false;
  a.webkitPreservesPitch=false;
  a.volume=.76+Math.random()*.15;
  physicalClickVoices.add(a);
  const clean=()=>physicalClickVoices.delete(a);
  a.addEventListener('ended',clean,{once:true});a.addEventListener('error',clean,{once:true});
  a.play().catch(clean);
}

function playKeycapClick(){playPhysicalKeyClick()}

function initZen(){const c=$('.zen-canvas',$('#playground'));if(!c)return;zenCanvas=c;const rect=c.getBoundingClientRect(),scale=window.devicePixelRatio||1;c.width=Math.round(rect.width*scale);c.height=Math.round(rect.height*scale);zenCtx=c.getContext('2d');zenCtx.scale(scale,scale);zenCtx.strokeStyle='#98785e88';zenCtx.lineWidth=2;zenCtx.lineCap='round';zenCtx.lineJoin='round';zenCtx.clearRect(0,0,rect.width,rect.height)}

function drawBowl(){if(!bowlCtx||!bowlCanvas)return;const ctx=bowlCtx,b=bowlDims(),{W,H,x,y,rx:r,ry,depth:d}=b;ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(x,y,20,x,y,r*2.4);bg.addColorStop(0,`rgba(249,206,152,${.05+bowlHalo*.14})`);bg.addColorStop(1,'rgba(255,242,222,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(x,y+d*.83);ctx.scale(1,.24);let sh=ctx.createRadialGradient(0,0,5,0,0,r*1.7);sh.addColorStop(0,'#77606924');sh.addColorStop(1,'#77606900');ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,r*1.7,0,Math.PI*2);ctx.fill();ctx.restore();const cushion=ctx.createLinearGradient(0,y+d*.52,0,y+d*.95);cushion.addColorStop(0,'#c8a9a0');cushion.addColorStop(1,'#806b78');ctx.fillStyle=cushion;ctx.beginPath();ctx.ellipse(x,y+d*.79,r*.53,d*.16,0,0,Math.PI*2);ctx.fill();const body=ctx.createLinearGradient(x-r,y,x+r,y+d);body.addColorStop(0,'#73523d');body.addColorStop(.13,'#bf996a');body.addColorStop(.34,'#f2d5a3');body.addColorStop(.57,'#cdab7a');body.addColorStop(.79,'#a77a55');body.addColorStop(1,'#70513e');ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(x-r,y-d*.24);ctx.bezierCurveTo(x-r*1.04,y+d*.35,x-r*.7,y+d*.95,x,y+d*.97);ctx.bezierCurveTo(x+r*.7,y+d*.95,x+r*1.04,y+d*.35,x+r,y-d*.24);ctx.closePath();ctx.fill();for(let i=0;i<70;i++){let yy=y-d*.14+i/70*d*.95,hw=r*(1-.29*Math.pow((yy-(y-d*.14))/d,1.5));ctx.beginPath();ctx.strokeStyle=`rgba(${i%2?'255,244,214':'86,56,38'},${.017+(i%7===0?.03:0)})`;ctx.lineWidth=.45;ctx.moveTo(x-hw,yy);ctx.quadraticCurveTo(x,yy+3,x+hw,yy);ctx.stroke()}let inner=ctx.createRadialGradient(x,y-d*.30,5,x,y-d*.24,r);inner.addColorStop(0,'#ead1ad');inner.addColorStop(.45,'#b48c60');inner.addColorStop(.77,'#6b4d38');inner.addColorStop(1,'#3b302f');ctx.fillStyle=inner;ctx.beginPath();ctx.ellipse(x,y-d*.24,r,d*.32,0,0,Math.PI*2);ctx.fill();for(let i=0;i<10;i++){ctx.beginPath();ctx.ellipse(x,y-d*.24,r*(.18+i*.065),d*.32*(.18+i*.065),0,0,Math.PI*2);ctx.lineWidth=.7;ctx.strokeStyle=`rgba(255,229,183,${.035+i*.006+bowlHalo*.012})`;ctx.stroke()}ctx.beginPath();ctx.ellipse(x,y-d*.24,r,d*.32,0,0,Math.PI*2);ctx.lineWidth=Math.max(5,r*.035);let rim=ctx.createLinearGradient(x-r,y,x+r,y);rim.addColorStop(0,'#7d5b44');rim.addColorStop(.3,'#f8e0b0');rim.addColorStop(.6,'#ba976d');rim.addColorStop(1,'#6a4d40');ctx.strokeStyle=rim;ctx.stroke();ctx.beginPath();ctx.ellipse(x,y-d*.24,r+3,d*.32+1,0,Math.PI*.06,Math.PI*.94);ctx.strokeStyle='#fff0cb75';ctx.lineWidth=2.5;ctx.stroke();bowlWaves=bowlWaves.filter(v=>v.alpha>.007);for(let w of bowlWaves){w.r+=1.25;w.alpha*=.982;ctx.beginPath();ctx.ellipse(x,y,r+w.r,d*.4+w.r*.35,0,0,Math.PI*2);ctx.strokeStyle=`rgba(166,117,154,${w.alpha})`;ctx.lineWidth=1.4;ctx.stroke()}bowlHalo*=bowlSustain?.993:.968}
function initBeads(){beadValue=0;beadAngle=0;renderBeads()}
function resetBeads(){beadValue=0;beadAngle=0;renderBeads();tone(410,.2)}
function renderBeads(){const wrap=$('.bead-loop-wrap',$('#playground'));if(!wrap)return;const beads=$$('.bead',wrap),cx=120,cy=118,rx=90,ry=96;beads.forEach((el,i)=>{const a=i/beads.length*Math.PI*2+beadAngle,x=cx+rx*Math.sin(a)-15,y=cy-ry*Math.cos(a)-15,s=1+Math.sin(a)*.08;el.style.left=x+'px';el.style.top=y+'px';el.style.transform=`scale(${s})`;el.style.zIndex=String(100+Math.round((Math.cos(a)+1)*50));el.classList.toggle('active',i===((beadValue%beads.length)+beads.length)%beads.length)});const n=$('.beads-number',$('#playground')),bar=$('.beads-bar',$('#playground'));if(n)n.textContent=beadValue;if(bar)bar.style.width=(beadValue/108*100)+'%'}
function beadStep(steps=1){if(beadValue>=108)return;const before=beadValue;beadValue=Math.min(108,beadValue+steps);beadAngle+=(beadValue-before)*(Math.PI*2/28);renderBeads();tone(540,.13,'sine',.02,350);count();if(beadValue===108)toast('A small moment, just for you ✧')}
let drawing=false,lastX=0,lastY=0,lastZenNoise=0;
function zenPoint(e){const c=zenCanvas,r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function zenDraw(p){if(!zenCtx)return;const dx=p.x-lastX,dy=p.y-lastY,len=Math.hypot(dx,dy);if(len<1)return;const offX=-dy/len,offY=dx/len;for(let i=-2;i<=2;i++){zenCtx.beginPath();zenCtx.moveTo(lastX+offX*i*4,lastY+offY*i*4);zenCtx.lineTo(p.x+offX*i*4,p.y+offY*i*4);zenCtx.stroke()}lastX=p.x;lastY=p.y;const now=Date.now();if(now-lastZenNoise>130){noise(.1,.018,500);lastZenNoise=now}count()}
window.addEventListener('resize',()=>{if(currentTool==='bowl')sizeBowl();if(currentTool==='beads')renderBeads()});
document.addEventListener('click',e=>{const tool=e.target.closest('[data-tool]');if(tool&&!$('#detail').classList.contains('open')){openTool(tool.dataset.tool);return}const nav=e.target.closest('[data-nav]');if(nav){render(nav.dataset.nav);return}const m=e.target.closest('[data-mood]');if(m){mood=m.dataset.mood;localStorage.setItem('nook-mood',mood);$$('.mood').forEach(x=>x.classList.toggle('active',x===m));toast(mood==='Stressed'?'Try Squishy or Bubble Pop ✨':mood==='Anxious'?'Try the Singing Bowl ✨':mood==='Tired'?'Try the Candle ✨':'Stay a while ✨');return}if(e.target.closest('#toggleAudio')){soundOn=!soundOn;render('profile')}if(e.target.closest('#resetStats')){sessions=0;touches=0;localStorage.setItem('nook-sessions',0);localStorage.setItem('nook-touches',0);render('profile');toast('Your recap has been reset')}if(e.target.closest('.pop-bubble')&&currentTool==='pop'){const b=e.target.closest('.pop-bubble');b.classList.toggle('down');tone(b.classList.contains('down')?280:420,.11,'sine',.09,b.classList.contains('down')?180:320);noise(.055,.065,650);count()}if(e.target.closest('.bead')&&currentTool==='beads'){beadStep(1)}});
$('#back').addEventListener('click',back);$('#soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('#soundToggle').textContent=soundOn?'♫':'×';toast(soundOn?'Sound on':'Sound off')});let pressing=false;
$('#playground').addEventListener('pointerdown',e=>{if(currentTool==='keycap'){pressKey();return}if(currentTool==='candle'){toggleFlame();return}if(currentTool==='squish'){pressing=true;squish(true);return}if(currentTool==='zen'){if(!zenCanvas)initZen();drawing=true;const p=zenPoint(e);lastX=p.x;lastY=p.y;try{e.target.setPointerCapture(e.pointerId)}catch{};return}if(currentTool==='bowl'){if(!bowlCanvas)initBowl();const p=bowlPoint(e),info=bowlRimInfo(p.x,p.y);if(info.near){bowlPointer=e.pointerId;bowlSustain=true;bowlLastAng=info.angle;try{e.target.setPointerCapture(e.pointerId)}catch{};sustainBowl()}else if(info.interior){ringBowl(1)}return}if(currentTool==='beads'){beadDrag=true;beadLastY=e.clientY;beadAccum=0;$('.bead-loop-wrap',$('#playground'))?.classList.add('dragging');try{e.target.setPointerCapture(e.pointerId)}catch{};return}});
$('#playground').addEventListener('pointermove',e=>{if(drawing&&currentTool==='zen'){zenDraw(zenPoint(e))}if(currentTool==='bowl'&&bowlSustain&&bowlPointer===e.pointerId){const p=bowlPoint(e),info=bowlRimInfo(p.x,p.y),delta=Math.atan2(Math.sin(info.angle-bowlLastAng),Math.cos(info.angle-bowlLastAng));bowlLastAng=info.angle;const mag=Math.abs(delta);if(info.near&&mag>.005&&mag<.38)sustainBowl()}if(currentTool==='beads'&&beadDrag){const delta=Math.abs(e.clientY-beadLastY);beadLastY=e.clientY;beadAccum+=delta;const steps=Math.floor(beadAccum/24);if(steps){beadAccum-=steps*24;beadStep(steps)}}});
function stopPointer(e){if(pressing){squish(false);pressing=false}if(bowlPointer===e?.pointerId||e==null){bowlPointer=null;bowlSustain=false}if(beadDrag){beadDrag=false;$('.bead-loop-wrap',$('#playground'))?.classList.remove('dragging')}drawing=false}$('#playground').addEventListener('pointerup',stopPointer);$('#playground').addEventListener('pointercancel',stopPointer);window.addEventListener('pointerup',stopPointer);

/* Spline application runtime bridge: uses real named scene objects, only when a
   published scene.splinecode URL is supplied. This does not fabricate a Spline export. */
const splineNames={
 keycap:['Keycap Housing','Keycap Press','Keycap Highlight'],
 pop:['Popit Silicone Tray',...Array.from({length:9},(_,i)=>'Pop Bubble '+i)],
 squish:['Squishy Body','Squishy Ear Left','Squishy Ear Right','Squishy Eye 0','Squishy Eye 1','Squishy Nose'],
 bowl:['Singing Bowl Bronze','Singing Bowl Golden Rim','Singing Bowl Cushion','Singing Bowl Mallet'],
 zen:['Zen Garden Oak Frame','Zen Garden Sand',...Array.from({length:9},(_,i)=>'Zen Sand Rake '+i),'Zen Stone 0','Zen Stone 1'],
 candle:['Candle Frosted Vessel','Candle Warm Wax','Candle Wick','Candle Flame','Candle Flame Core','Candle Flame Glow']
};
const sceneCenters={keycap:[-185,80,-8],pop:[0,77,-12],squish:[185,93,-11],bowl:[-185,-107,-12],zen:[0,-118,-12],candle:[185,-103,-12]};
const splineHints={
 keycap:'Tap anywhere to press the keycap.',
 pop:'Tap the bubbles. Each pop feels a little different.',
 squish:'Press and hold to squash. Release to rebound.',
 bowl:'Tap to ring. Drag slowly to sustain its sound.',
 zen:'Drag to trace patterns across the sand.',
 candle:'Tap to light or extinguish the flame.'
};
function validSplineUrl(v){try{const u=new URL(v);return u.protocol==='https:'&&(u.hostname==='prod.spline.design'||u.hostname==='draft.spline.design')&&u.pathname.endsWith('/scene.splinecode')}catch{return false}}
function closeSplineRitual(){splineRitual=null;$('#splineStage').classList.remove('open');cancelAnimationFrame(splineFrame);splineFrame=0;splinePointer=null;if(splineApp){try{splineApp.dispose()}catch(e){console.warn('Spline dispose:',e)}splineApp=null}splineOriginals.clear();$('#ritualFrame').style.display='block'}
function splineObject(name){try{return splineApp?.findObjectByName(name)||null}catch{return null}}
function animateSpline(name,pose){const object=splineObject(name);if(!object)return;const orig=splineOriginals.get(name);if(!orig)return;if(pose.position){object.position.set(orig.position[0]+(pose.position[0]||0),orig.position[1]+(pose.position[1]||0),orig.position[2]+(pose.position[2]||0))}if(pose.scale){object.scale.set(orig.scale[0]*pose.scale[0],orig.scale[1]*pose.scale[1],orig.scale[2]*pose.scale[2])}if(pose.rotation){object.rotation.set(orig.rotation[0]+(pose.rotation[0]||0),orig.rotation[1]+(pose.rotation[1]||0),orig.rotation[2]+(pose.rotation[2]||0))}if(typeof pose.visible==='boolean')object.visible=pose.visible}
function setupSplineObjects(id){const allowed=new Set(splineNames[id]);const centers=sceneCenters[id];const allNames=Object.values(splineNames).flat();splineOriginals.clear();let found=0;for(const name of allNames){const o=splineObject(name);if(!o)continue;splineOriginals.set(name,{position:[o.position.x,o.position.y,o.position.z],scale:[o.scale.x,o.scale.y,o.scale.z],rotation:[o.rotation.x,o.rotation.y,o.rotation.z]});o.visible=allowed.has(name);if(allowed.has(name)){found++;o.position.set(o.position.x-centers[0],o.position.y-centers[1],o.position.z-centers[2])}}
// Positions are now recentered; remember these as reset transforms.
for(const name of allowed){const o=splineObject(name);if(o){splineOriginals.set(name,{position:[o.position.x,o.position.y,o.position.z],scale:[o.scale.x,o.scale.y,o.scale.z],rotation:[o.rotation.x,o.rotation.y,o.rotation.z]})}}
return found}
async function openSplineRitual(id){const stage=$('#splineStage');stage.classList.add('open');$('#ritualFrame').style.display='none';$('#ritualFrame').srcdoc='';$('#splineTitle').textContent=tools.find(t=>t.id===id)?.name||'NooK';$('#splineDescription').textContent=tools.find(t=>t.id===id)?.desc||'';$('#splineGesture').textContent='Loading Spline 3D model…';$('#splineAction').textContent='Interact ✦';splineRitual={id,pressed:false,pops:new Set(),lit:true,drag:0,energy:0,time:performance.now(),last:performance.now(),lines:[],pointerDown:false};
try{if(!validSplineUrl(splineUrl))throw Error('Paste a valid published Spline scene.splinecode URL in Profile.');const {Application}=await import('https://unpkg.com/@splinetool/runtime@1.12.77/build/runtime.js');if(!splineRitual||splineRitual.id!==id)return;const canvas=$('#splineCanvas');const app=new Application(canvas);splineApp=app;await app.load(splineUrl);if(!splineRitual||splineRitual.id!==id){app.dispose();return}const found=setupSplineObjects(id);if(!found)throw Error('The exported scene does not include matching NooK object names.');$('#splineGesture').textContent=splineHints[id];$('#splineAction').textContent=id==='candle'?'Light / Extinguish':id==='pop'?'Pop a bubble':id==='zen'?'Clear gesture':'Interact ✦';startSplineAnimation();}
catch(err){console.error('Spline load error:',err);toast('Using original NooK ritual');closeSplineRitual();$('#ritualFrame').srcdoc=decodeRitual(embeddedRituals[id])}}
function splineReset(){if(!splineRitual)return;splineRitual.pressed=false;splineRitual.pops.clear();splineRitual.lit=true;splineRitual.drag=0;splineRitual.energy=0;splineRitual.lines=[];for(const [name,orig] of splineOriginals){if(!splineNames[splineRitual.id].includes(name))continue;const o=splineObject(name);if(!o)continue;o.scale.set(...orig.scale);o.rotation.set(...orig.rotation);o.position.set(...orig.position);o.visible=true}$('#splineGesture').textContent=splineHints[splineRitual.id]}
function startSplineAnimation(){cancelAnimationFrame(splineFrame);const tick=now=>{const r=splineRitual;if(!r||!splineApp)return;const t=now/1000;
if(r.id==='candle'&&r.lit){const x=.94+Math.sin(t*8)*.10+Math.sin(t*13)*.035;animateSpline('Candle Flame',{scale:[x,1.03+Math.sin(t*7)*.10,x]});animateSpline('Candle Flame Core',{scale:[.95,1+Math.sin(t*11)*.12,.95]})}
if(r.id==='bowl'){r.energy*=.972;animateSpline('Singing Bowl Bronze',{rotation:[0,Math.sin(t*21)*r.energy*.018,Math.sin(t*27)*r.energy*.012]})}
if(r.id==='squish'&&!r.pressed){const b=1+Math.sin(t*1.2)*.007;animateSpline('Squishy Body',{scale:[b,1/b,b]})}
splineFrame=requestAnimationFrame(tick)};splineFrame=requestAnimationFrame(tick)}
function splineBeep(kind){if(!soundOn)return;if(kind==='keycap'){playKeycapClick();return}const opts={keycap:[210,.09,'triangle',.055],pop:[340,.1,'sine',.055],squish:[165,.21,'sine',.045],bowl:[196,3.8,'sine',.035],zen:[430,.08,'triangle',.014],candle:[510,.24,'sine',.025]};let [hz,d,type,v]=opts[kind]||opts.keycap;tone(hz,d,type,v);if(kind==='bowl'){tone(392,2.8,'sine',.019);tone(523.2,2.1,'sine',.011)}if(kind==='keycap'||kind==='pop')noise(.045,.032,1200)}
function interactSpline(x=.5,y=.5,phase='down'){const r=splineRitual;if(!r||!splineApp)return;const id=r.id;
if(id==='keycap'){if(phase==='down'){animateSpline('Keycap Press',{position:[0,-11,0],scale:[1,.74,1]});animateSpline('Keycap Highlight',{position:[0,-11,0]});splineBeep(id);count()}else if(phase==='up'){animateSpline('Keycap Press',{position:[0,0,0],scale:[1,1,1]});animateSpline('Keycap Highlight',{position:[0,0,0]})}}
if(id==='pop'&&phase==='down'){const col=Math.min(2,Math.max(0,Math.floor(x*3))),row=Math.min(2,Math.max(0,Math.floor(y*3)));const n=row*3+col;const name='Pop Bubble '+n;if(r.pops.has(n)){r.pops.delete(n);animateSpline(name,{scale:[1,1,1],position:[0,0,0]})}else{r.pops.add(n);animateSpline(name,{scale:[.95,.32,.95],position:[0,-8,0]})}splineBeep(id);count()}
if(id==='squish'){if(phase==='down'||phase==='move'){r.pressed=true;const dx=Math.min(1,Math.max(-1,(x-.5)*2));animateSpline('Squishy Body',{scale:[1.18,.65,.99],position:[dx*3,-12,0]});for(const p of ['Squishy Ear Left','Squishy Ear Right'])animateSpline(p,{position:[0,-8,0]});if(phase==='down'){splineBeep(id);count()}}else if(phase==='up'){r.pressed=false;animateSpline('Squishy Body',{scale:[1,1,1],position:[0,0,0]});for(const p of ['Squishy Ear Left','Squishy Ear Right'])animateSpline(p,{position:[0,0,0]})}}
if(id==='bowl'&&(phase==='down'||phase==='move')){const now=performance.now();if(phase==='down'||now-splineLastMove>190){r.energy=1;splineBeep(id);count();splineLastMove=now}}
if(id==='zen'&&phase==='move'){const now=performance.now();if(now-splineLastMove>50){const line=Math.max(0,Math.min(8,Math.floor(y*9)));animateSpline('Zen Sand Rake '+line,{position:[(x-.5)*12,0,(y-.5)*10]});splineLastMove=now;count()}}
if(id==='candle'&&phase==='down'){r.lit=!r.lit;animateSpline('Candle Flame',{visible:r.lit});animateSpline('Candle Flame Core',{visible:r.lit});animateSpline('Candle Flame Glow',{visible:r.lit});splineBeep(id);count()}}
$('#splineCanvas').addEventListener('pointerdown',e=>{if(!splineRitual)return;const r=e.currentTarget.getBoundingClientRect();splinePointer=e.pointerId;splineRitual.pointerDown=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch{};interactSpline((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,'down')});
$('#splineCanvas').addEventListener('pointermove',e=>{if(splinePointer!==e.pointerId||!splineRitual?.pointerDown)return;const r=e.currentTarget.getBoundingClientRect();interactSpline((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,'move')});
for(const eventName of ['pointerup','pointercancel'])$('#splineCanvas').addEventListener(eventName,e=>{if(!splineRitual||splinePointer!==e.pointerId)return;const r=e.currentTarget.getBoundingClientRect();interactSpline((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,'up');splinePointer=null;splineRitual.pointerDown=false});
$('#splineAction').addEventListener('click',()=>{if(!splineRitual)return;interactSpline(.5,.5,'down');if(splineRitual.id==='keycap'||splineRitual.id==='squish')setTimeout(()=>interactSpline(.5,.5,'up'),145)});
$('#splineReset').addEventListener('click',splineReset);
$('#splineSound').addEventListener('click',()=>{soundOn=!soundOn;$('#splineSound').textContent=soundOn?'♫ Sound on':'× Sound off'});
document.addEventListener('click',e=>{if(e.target?.id==='saveSpline'){const url=$('#splineUrl')?.value.trim()||'';if(!validSplineUrl(url)){toast('Use a published scene.splinecode URL');return}splineUrl=url;localStorage.setItem('nook-spline-url',url);render('profile');toast('Spline scene saved on this device')}if(e.target?.id==='clearSpline'){splineUrl='';localStorage.removeItem('nook-spline-url');render('profile');toast('Original NooK rituals enabled')}});

window.addEventListener('keydown',e=>{if(e.key==='Escape'&&currentTool)back()});render('home');
