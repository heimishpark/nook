<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIMU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap" rel="stylesheet">
<style>
:root{
  --surround:#efe8ee; --ink:#4a2f3f;
  --pink:#f4bcd8; --hot:#f2a2ce; --mint:#b4e4d6; --lilac:#d9c6e8; --lime:#dff2c4; --mist:#e9f1f6;
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surround:#17121a}}
:root[data-theme="dark"]{--surround:#17121a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--surround)}
body{display:grid;place-items:center;overflow:hidden}

.stage{position:relative;width:min(100vw,393px);height:min(100dvh,852px);overflow:hidden;
  background:var(--pink);isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (min-width:431px){.stage{border-radius:48px;box-shadow:0 30px 80px rgba(60,20,50,.28)}}

.bg{position:absolute;inset:0;z-index:0;background:
  radial-gradient(65% 32% at 100% 0%,var(--mint) 0%,transparent 72%),
  radial-gradient(55% 28% at 0% 4%,var(--hot) 0%,transparent 72%),
  radial-gradient(45% 22% at 62% 14%,var(--lilac) 0%,transparent 75%),
  radial-gradient(75% 26% at 0% 100%,var(--lime) 0%,transparent 72%),
  radial-gradient(60% 24% at 58% 100%,var(--mist) 0%,transparent 75%),
  radial-gradient(40% 18% at 100% 96%,#f3c3d8 0%,transparent 75%),var(--pink)}

.marquee{position:absolute;left:0;top:30%;z-index:1;display:flex;width:max-content;white-space:nowrap;
  font-weight:600;font-size:118px;line-height:1;letter-spacing:-.05em;color:rgba(255,255,255,.58);
  animation:slide 16s linear infinite;pointer-events:none}
.marquee span{padding-right:.55em}
@keyframes slide{to{transform:translateX(-50%)}}

.grain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='1.6 0 0 0 -.3  0 1.6 0 0 -.3  0 0 1.6 0 -.3  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.shadow{position:absolute;left:50%;top:60.5%;width:52%;height:22px;margin-left:-26%;z-index:3;border-radius:50%;
  background:radial-gradient(closest-side,rgba(150,70,120,.28),transparent);transform-origin:center;pointer-events:none}

.cloud{position:absolute;left:50%;top:48%;width:76%;aspect-ratio:1060/850;margin:0 0 0 -38%;transform:translateY(-50%);z-index:4;
  border:0;background:none;padding:0;cursor:grab;touch-action:none;outline:none;border-radius:40%}
.cloud:active{cursor:grabbing}
.cloud:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 6px rgba(120,60,110,.55)}
.body{position:absolute;inset:0;transform-origin:50% 88%;will-change:transform}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.layer.off{opacity:0}

.hint{position:absolute;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5;text-align:center;
  font-weight:700;font-size:17px;color:var(--ink);opacity:.7;transition:opacity .5s;pointer-events:none}
.hint.gone{opacity:0}
.auth{position:absolute;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;align-items:center;gap:10px;
  font:700 19px/1 'Nunito',system-ui,sans-serif;color:var(--ink);
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),visibility 0s 1.2s}
.auth.show{opacity:1;visibility:visible;transform:none;transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),visibility 0s}
.auth button{all:unset;cursor:pointer;padding:12px 6px;font:inherit;text-underline-offset:5px}
.auth button:hover,.auth button:active{text-decoration:underline}
.auth button:focus-visible{outline:3px solid rgba(120,60,110,.6);outline-offset:2px;border-radius:6px}
.auth .in{font-weight:600;opacity:.8}
.auth .up{font-weight:800}
.auth .sep{opacity:.4;font-weight:400}
@media (prefers-reduced-motion:reduce){.auth,.auth.show{transition:none}}
@media (prefers-reduced-motion:reduce){.marquee{animation:none;transform:translateX(-6%)}}
.stage{transition:opacity .45s ease}.stage.leave{opacity:0;pointer-events:none}
</style>
</head>

<script>
(function(){
  var cloud=document.getElementById('cloud'),body=document.getElementById('body'),shadow=document.getElementById('shadow'),
      hint=document.getElementById('hint'),cta=document.getElementById('cta'),front=document.getElementById('front'),
      belly=document.getElementById('belly');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var holding=false,hoverUntil=0,burstUntil=0,I=0,px=0,py=0,held=0,bel=0,last=0,seen=false;

  function pos(e){var r=cloud.getBoundingClientRect();px=(e.clientX-(r.left+r.width/2))/r.width;py=(e.clientY-(r.top+r.height/2))/r.height;}
  cloud.addEventListener('pointerdown',function(e){holding=true;pos(e);try{cloud.setPointerCapture(e.pointerId)}catch(_){}});
  cloud.addEventListener('pointermove',function(e){pos(e);if(!holding&&e.pointerType==='mouse')hoverUntil=performance.now()+200;});
  ['pointerup','pointercancel'].forEach(function(t){cloud.addEventListener(t,function(){holding=false;});});
  cloud.addEventListener('click',function(e){if(e.detail===0)burstUntil=performance.now()+2600;});
  cloud.addEventListener('contextmenu',function(e){e.preventDefault()});

  function showCta(){hint.classList.add('gone');cta.classList.add('show');}
  setTimeout(showCta,7000);
  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function sm(a,b,v){var x=clamp((v-a)/(b-a),0,1);return x*x*(3-2*x)}

  function frame(t){
