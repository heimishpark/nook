<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF3E2">
<title>NooK</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF3E2;--bg2:#FFE3C8;--card:rgba(255,255,255,.62);--ink:#3B2A3A;--sub:#7A6070;--line:#F2B8A2;--btn:#3B2A3A;--btnt:#FFF8EC;--k:#24104F;--cream:#FFF8EC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#FFF3E2 center/cover no-repeat;color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;display:flex;justify-content:center}
#phone{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column}
#app{flex:1;overflow-y:auto;padding:22px 20px 16px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:600}
h2{font-size:22px;margin:0 0 6px;font-weight:500}
p{margin:0 0 14px;color:var(--sub);font-size:16px;line-height:1.45}
.brand{font-size:14px;color:var(--sub);margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);font:inherit;font-weight:500;font-size:18px;padding:15px;cursor:pointer;margin-top:12px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--sub);font-size:15px;padding:10px;margin-top:2px}
.btn.sm{display:inline-block;width:auto;padding:10px 18px;font-size:15px;margin:8px 8px 0 0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #FFD24D;outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.emo{background:var(--card);border:3px solid transparent;border-radius:26px;padding:10px 4px 8px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:15px}
.emo svg{width:72px;height:75px;transition:transform .25s}
.emo:hover svg{transform:rotate(-6deg) scale(1.07)}
.emo[aria-pressed=true]{border-color:var(--ink);background:var(--line)}
.hero{display:flex;justify-content:center;margin:4px 0 10px}
.hero svg{width:130px;height:135px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
input[type=range]{width:100%;accent-color:#FFD24D;margin:8px 0}
.row{display:flex;justify-content:space-between;color:var(--sub);font-size:14px}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:12px 14px;resize:none}
.box{background:var(--card);border-radius:26px;padding:14px;margin:10px 0;position:relative;overflow:hidden}
.sky{height:190px}
.bub{position:absolute;background:#F4EDFF;color:var(--k);border-radius:999px;padding:5px 12px;font-size:14px;transition:transform 2s ease-in,opacity 2s;animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-160px)}}
.go .bub{transform:translateY(-260px) rotate(8deg);opacity:0}
.circ{width:120px;height:120px;border-radius:50%;margin:46px auto;transition:transform 4s ease-in-out;box-shadow:0 0 50px 8px var(--glow)}
canvas{width:100%;height:260px;touch-action:none;display:block;border-radius:18px;background:rgba(255,255,255,.06)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:2px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:15px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--k);border-color:var(--ink)}
.zone{border:2px dashed var(--line);border-radius:20px;padding:10px;min-height:64px;margin:8px 0}
.zone small{display:block;color:var(--sub);font-size:13px;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:0;border-radius:20px;padding:15px 16px;font:inherit;font-size:17px;margin:8px 0;cursor:pointer}
.tabs{display:flex;border-top:2px solid var(--line);background:#1B0B3F}
.tab{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--sub);padding:10px 0 12px;cursor:pointer}
.tab[aria-current=page]{color:var(--ink)}
.tab svg{width:28px;height:28px;display:block;margin:0 auto 2px}
.arch{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.cell{aspect-ratio:1;border-radius:18px;border:2px dashed var(--line);background:transparent;display:flex;align-items:center;justify-content:center;font:inherit;font-size:13px;color:var(--line);padding:0}
.cell.on{border:2px solid transparent;background:var(--card);cursor:pointer}
.cell.on svg{width:80%;height:80%}
.cell.sel{border-color:var(--ink)}
.det{background:var(--card);border-radius:24px;padding:16px;margin:10px 0}
.det .r{display:flex;gap:12px;align-items:center}
.det svg.c{width:64px;height:67px;flex:none}
.det img{width:100%;border-radius:14px;margin-top:10px;background:rgba(255,255,255,.06)}
.det b{font-weight:500;font-size:18px}
.det small{display:block;color:var(--sub);font-size:14px}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
.note{background:var(--card);border-radius:20px;padding:12px 14px;font-size:14px;line-height:1.4;color:var(--sub);margin:10px 0}
.note b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px}
.dots{display:flex;gap:5px;margin-bottom:14px}
.dots i{flex:1;height:8px;border-radius:99px;border:2px solid var(--line);transition:background .3s}
.dots i.cur{transform:scaleY(1.5)}
.qh{display:flex;align-items:flex-end;gap:8px;margin:6px 0 12px}
.qh svg{width:84px;height:88px;flex:none;animation:bob 3s ease-in-out infinite}
.bubble{flex:1;background:var(--card);border-radius:24px 24px 24px 6px;padding:14px 16px;font-size:18px;line-height:1.3;font-weight:500}
.bubble span{display:block;color:var(--sub);font-size:13px;margin-bottom:4px}
.ans{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);color:var(--ink);border:3px solid transparent;border-radius:999px;padding:8px 18px 8px 12px;font:inherit;font-size:17px;margin:8px 0;cursor:pointer;transition:transform .15s}
.ans:active{transform:scale(.97)}
.ans[aria-pressed=true]{border-color:var(--ink);background:var(--line)}
.ans svg{flex:none}
.bt2{display:flex;justify-content:space-between}
.cupw{position:relative;width:150px;margin:8px auto}
.cupw:after{content:"";position:absolute;right:-26px;top:50px;width:36px;height:70px;border:4px solid var(--ink);border-left:0;border-radius:0 36px 36px 0}
.cup{width:100%;height:220px;border:4px solid var(--ink);border-top:0;border-radius:0 0 40px 40px;display:flex;flex-direction:column-reverse;overflow:hidden;background:rgba(255,255,255,.06)}
.lay{height:12.5%;flex:none;color:var(--k);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-top:2px solid rgba(36,16,79,.25);animation:rise .5s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translateY(-40px);opacity:0}}
.cupw.s{width:80px;margin:0 26px 0 0}
.cupw.s:after{right:-18px;top:25px;width:20px;height:36px;border-width:3px;border-radius:0 20px 20px 0}
.cup.s{height:110px;border-width:3px;border-radius:0 0 24px 24px}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.li{margin:4px 0 8px;padding:0;list-style:none;color:var(--sub)}.li li{margin:3px 0}
.opt[aria-pressed=true]{background:var(--line);outline:2px solid var(--ink)}
.vin{width:70px;height:70px;border-radius:50%;background:repeating-radial-gradient(circle,#1B0B3F 0 2px,#2B1560 2px 4px);position:relative;flex:none;animation:spin 7s linear infinite}
.vin:after{content:"";position:absolute;inset:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #1B0B3F}
.vin.big{width:110px;height:110px;margin:6px auto 12px}.vin.big:after{inset:40px}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{position:relative;height:440px;margin:10px 0;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 100%,#2a1238,#0c0518 70%)}
.stage canvas{width:100%;height:100%;display:block;background:none;border-radius:0;touch-action:auto}
.irow{display:flex;gap:8px}.irow .btn{margin:0;width:auto;padding:0 22px;font-size:20px}
#lb{display:block;font-size:14px;color:var(--sub);margin:4px 0 6px}

/* light pastel background adjustments */
.tabs{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px solid rgba(255,255,255,.7)}
.chip{background:rgba(255,255,255,.35)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.bub{background:var(--ink);color:var(--cream)}
canvas{background:rgba(255,255,255,.5)}
.cup{background:rgba(255,255,255,.4)}
.det img{background:rgba(255,255,255,.5)}
textarea,input[type=text]{background:rgba(255,255,255,.7)}
textarea::placeholder,input[type=text]::placeholder{color:var(--sub);opacity:.8}
.cell{color:var(--sub);border-color:rgba(122,96,112,.35)}
.cell.sel{border-color:var(--ink)}
.dots i{border-color:rgba(122,96,112,.4)}
.zone{border-color:rgba(122,96,112,.4)}
.btn.ghost{color:var(--sub)}
.stage canvas{background:none}

<script>
const K='#24104F';
const E={joy:{n:'Joy',c:'#FFD24D'},calm:{n:'Calm',c:'#7FE0B0'},anx:{n:'Anxious',c:'#FF8A50'},sad:{n:'Sad',c:'#5FB0FF'},angry:{n:'Angry',c:'#FF5C6C'},tired:{n:'Drained',c:'#C9B2FF'}};
function body(t){const c=E[t].c;
 if(t==='joy'){let s='';for(let i=0;i<7;i++){const a=i/7*6.283;s+=`<circle cx="${50+28*Math.cos(a)}" cy="${48+28*Math.sin(a)}" r="19" fill="${c}"/>`}return s+`<circle cx="50" cy="48" r="30" fill="${c}"/>`}
 if(t==='anx'){let p=[];for(let i=0;i<18;i++){const r=i%2?29:45,a=i/18*6.283-1.57;p.push((50+r*Math.cos(a)).toFixed(1)+','+(50+r*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" fill="${c}" stroke="${c}" stroke-width="8" stroke-linejoin="round"/>`}
 if(t==='sad')return `<path d="M50 6C50 6 82 42 82 62C82 80 68 92 50 92C32 92 18 80 18 62C18 42 50 6 50 6Z" fill="${c}"/>`;
 if(t==='angry')return `<polygon points="50,12 90,82 10,82" fill="${c}" stroke="${c}" stroke-width="14" stroke-linejoin="round"/>`;
 if(t==='tired')return `<rect x="14" y="26" width="72" height="62" rx="31" fill="${c}" transform="rotate(-6 50 56)"/>`;
 return `<path d="M16 56C14 30 38 14 58 18C82 22 90 46 84 66C78 88 40 94 26 82C18 76 17 64 16 56Z" fill="${c}"/>`}
function face(t){
 const e=(x,y,dx,dy)=>`<circle cx="${x}" cy="${y}" r="9.5" fill="#fff"/><circle cx="${x+dx}" cy="${y+dy}" r="5" fill="${K}"/>`;
 const m=(d,f)=>`<path d="${d}" fill="${f||'none'}" stroke="${K}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;
 const y=t==='sad'?54:t==='angry'?58:50;
 if(t==='joy')return e(39,y,1,-2)+e(61,y,1,-2)+m('M39 64Q50 78 61 64Z',K);
 if(t==='calm')return e(39,y,0,1)+e(61,y,0,1)+m('M41 66Q50 72 59 66');
 if(t==='anx')return e(39,y,-3,-3)+e(61,y,3,-3)+m('M39 68Q44.5 62 50 68T61 68');
 if(t==='sad')return e(39,y,0,4)+e(61,y,0,4)+m('M41 72Q50 63 59 72')+m('M30 40L46 44')+m('M70 40L54 44');
 if(t==='angry')return e(40,y,2,2)+e(60,y,-2,2)+m('M42 70H58')+m('M30 44L47 52')+m('M70 44L53 52');
 return `<circle cx="39" cy="56" r="9.5" fill="#fff"/><circle cx="39" cy="59" r="4.5" fill="${K}"/><circle cx="61" cy="56" r="9.5" fill="#fff"/><circle cx="61" cy="59" r="4.5" fill="${K}"/>`+m('M29 52Q39 48 49 52')+m('M51 52Q61 48 71 52')+m('M44 71Q50 74 56 71')}
const legs=`<path d="M40 88V100M60 88V100M35 100H44M56 100H65" stroke="${K}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
const ch=(t,cls)=>`<svg ${cls?`class="${cls}" `:''}viewBox="0 0 100 104" aria-hidden="true">${legs}${body(t)}${face(t)}</svg>`;
function trace(t,s){const r=(s*47)%60-30,z=.7+((s*13)%30)/100;return `<svg viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50) rotate(${r}) scale(${z}) translate(-50 -50)">${body(t)}</g><path d="M${20+s%20} 80Q50 ${55+s%25} ${80-s%15} 84" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/></svg>`}
const esc=s=>String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
const ACT={joy:'savor',calm:'breathe',anx:'control',sad:'float',angry:'scribble',tired:'comfort'};
const AN={burn:'Tear it up, burn it down',song:'Song of the day',cup:'Fill your cup',savor:'Collect the glow',breathe:'Breathe with me',control:'Circle of control',float:'Let it float away',scribble:'Scribble it out',comfort:'Comfort menu'};
const AP={burn:'Write 3 thoughts you want to let go of, then watch them turn to ash.',song:'A song can hold a whole day.',cup:"See what has been filling you up lately, then find ways to empty it.",savor:'What made today glow? Tap everything that fits.',breathe:'Follow the circle. Three slow breaths.',control:'Add what weighs on you, then tap each one to sort it.',float:"Write a worry you can't fix right now, then let it drift off.",scribble:'No words needed. Draw how it feels.',comfort:'Pick one tiny thing for yourself.'};
const S={ob:0,ans:[],base:null,tab:'today',step:0,emo:null,energy:50,open:null,tm:null,cur:null,
 days:[]};
const $=document.getElementById('app'),q=id=>document.getElementById(id);
function tabs(){const ic={today:'<circle cx="14" cy="14" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="14" cy="14" r="3" fill="currentColor"/>',archive:'<rect x="4" y="4" width="8" height="8" rx="3" fill="currentColor"/><rect x="16" y="4" width="8" height="8" rx="3" fill="currentColor" opacity=".5"/><rect x="4" y="16" width="8" height="8" rx="3" fill="currentColor" opacity=".5"/><rect x="16" y="16" width="8" height="8" rx="3" fill="currentColor"/>'};
 const n={today:'Check-in',archive:'Archive'};
 q('tabs').innerHTML=Object.keys(n).map(k=>`<button class="tab" data-t="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 28 28" aria-hidden="true">${ic[k]}</svg>${n[k]}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.open=null;render()})}
function render(){clearInterval(S.tm);tabs();q('tabs').style.display=S.ob!==null?'none':'';(S.ob!==null?onb:S.tab==='today'?today:archive)();$.scrollTop=0}
const lab=v=>v<34?'Low':v<67?'Medium':'High';
function today(){
 if(S.step===0){$.innerHTML=`<div class="brand">NooK · Day ${S.days.length+1}</div><h1>How are you feeling today?</h1><p>Pick the friend who looks most like you right now.</p><div class="grid">${Object.keys(E).map(k=>`<button class="emo" data-k="${k}" aria-pressed="${S.emo===k}">${ch(k)}${E[k].n}</button>`).join('')}</div><div class="row"><span>Energy</span><span id="ev">${lab(S.energy)}</span></div><input type="range" id="en" min="0" max="100" value="${S.energy}" aria-label="Energy level"><div class="row"><span>Drained</span><span>Charged</span></div><button class="btn" id="nx" ${S.emo?'':'disabled'}>Start today's activity</button>`;
  en.oninput=()=>{S.energy=+en.value;ev.textContent=lab(S.energy)};
  document.querySelectorAll('.emo').forEach(b=>b.onclick=()=>{S.emo=b.dataset.k;render()});
  nx.onclick=()=>{S.step=1;render()};return}
 if(S.step===1){const a=actOf();$.innerHTML=`<div class="brand">Day ${S.days.length+1} · today's activity</div><div class="hero">${ch(S.emo)}</div><h2>${AN[a]}</h2><p>${AP[a]}</p><div id="ar"></div><button class="btn ghost" id="sk">Skip, I'm too tired today</button>`;
  sk.onclick=()=>fin('Skipped, rested instead');INIT[a](q('ar'));return}
 if(S.step===2){$.innerHTML=`<div class="hero">${ch(S.emo)}</div><h2>How do you feel now?</h2><p>One sentence is plenty. You can skip this.</p><textarea id="nt" rows="3" maxlength="80" placeholder="e.g. My shoulders feel lighter"></textarea><button class="btn" id="sv">Add to my archive</button><button class="btn ghost" id="s2">Skip</button>`;
  const sv2=n=>{S.days.push({burn:S.cur.burn,song:S.cur.song,emo:S.emo,e:S.energy,act:S.cur.act,detail:S.cur.detail,img:S.cur.img,cup:S.cur.cup,base:S.days.length?null:S.base,note:n});S.step=3;render()};
  sv.onclick=()=>sv2(nt.value.trim());s2.onclick=()=>sv2('');return}
 const n=S.days.length;$.innerHTML=`<div class="hero pop" style="margin-top:24px"><div style="width:170px;height:170px;background:var(--card);border-radius:46px;padding:14px">${trace(S.days[n-1].emo,n)}</div></div><h2 style="text-align:center">Day ${n} collected</h2><p style="text-align:center">Your feeling became a one-of-a-kind shape. Tap it anytime to revisit.</p><button class="btn" id="ar2">Open archive</button><button class="btn ghost" id="nw">Back to check-in</button>`;
 ar2.onclick=()=>{S.tab='archive';S.open=n-1;S.step=0;S.emo=null;S.energy=50;render()};nw.onclick=()=>{S.step=0;S.emo=null;S.energy=50;render()}}
const QS=["Have you found it harder than usual to enjoy the things you normally like?","Have you been feeling low, discouraged, or less hopeful than usual?","Have you had trouble falling asleep, staying asleep, or found yourself sleeping more than usual?","Have you often felt tired, drained, or low on energy?","Have you noticed changes in your appetite, such as eating much less or more than usual?","Have you been especially hard on yourself or felt like you were not doing well enough?","Have you found it difficult to focus on everyday things, like reading, watching something, studying, or working?","Have you noticed yourself moving or speaking more slowly than usual, or feeling unusually restless?","Have you had moments when you wished you could disappear, escape everything, or not have to be here for a while?","Have you been feeling overwhelmed by even small tasks or everyday responsibilities?","Have you felt disconnected from yourself, other people, or the things happening around you?","Overall, how emotionally supported and able to cope have you felt recently?"];
const OPT=['Not at all','A little','Sometimes','Often','Almost every day'],OC=['#7FE0B0','#FFD24D','#FF8A50','#FF5C6C','#C9B2FF'];
const TIER=[{h:'A light load',c:'calm',m:'Things seem fairly steady lately. A little space each day can help keep it that way.'},{h:'Carrying some weight',c:'tired',m:'A few things have felt heavier than usual. Small, gentle activities can help.'},{h:'Pretty heavy lately',c:'sad',m:'It sounds like a lot has been on you. Go slowly and pick the easy options.'},{h:'Really heavy lately',c:'sad',m:"It sounds like you've been carrying a lot. You don't have to handle it alone. Talking with a counselor, a doctor, or someone you trust can help."}];
function onb(){
 const i=S.ob;

  const put=()=>{const v=wt.value.trim();if(!v||L.length>=8)return;L.push({t:v,e:em});p0()};
  ad.onclick=put;wt.onkeydown=e=>{if(e.key==='Enter')put()};un.onclick=()=>{L.pop();p0()};nx.onclick=p1};
 const p1=()=>{el.innerHTML=cp(sel.size)+`<p style="text-align:center;margin:0 0 4px">Ways to empty your cup. Tap what sounds good and watch it drain.</p>`+I.map((t,i)=>`<button class="opt" data-i="${i}" aria-pressed="${sel.has(i)}">${t}</button>`).join('')+`<button class="btn" id="nx">Next: my 3 minutes</button>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);p1()});nx.onclick=p2};
 const p2=()=>{el.innerHTML=cp(sel.size)+`<p style="margin:0 0 8px;color:var(--ink)">What would you like to do for about 3 minutes to empty your cup?</p><textarea id="pl" rows="3" maxlength="100" placeholder="e.g. Put on a playlist and dance around my room"></textarea><button class="btn" id="dn" disabled>Save to my archive</button>`;
  pl.oninput=()=>dn.disabled=!pl.value.trim();dn.onclick=()=>{const t=pl.value.trim();fin('My 3 minutes: '+t,null,{cup:{items:L,ideas:[...sel].map(i=>I[i]),plan:t}})}};
 p0()},
float(el){const w=[];el.innerHTML=`<div class="box sky" id="sky"></div><input type="text" id="wt" maxlength="22" placeholder="Write a worry" aria-label="Worry"><button class="btn sm" id="ad">Add</button><button class="btn sm" id="lg" style="background:${E.sad.c}">Let it drift away</button>`;
 const put=()=>{const v=wt.value.trim();if(!v||w.length>=5)return;w.push(v);wt.value='';const b=document.createElement('div');b.className='bub';b.textContent=v;b.style.left=(4+(w.length*29)%48)+'%';b.style.top=(10+(w.length-1)*30)+'px';sky.appendChild(b)};
 ad.onclick=put;wt.onkeydown=e=>{if(e.key==='Enter')put()};
 lg.onclick=()=>{if(!w.length){wt.focus();return}sky.classList.add('go');setTimeout(()=>fin(w.length+(w.length>1?' worries':' worry')+' set down'),2100)}},
breathe(el){const c=E.calm.c;el.innerHTML=`<div class="box" style="--glow:${c}66;text-align:center"><div class="circ" id="ci" style="background:${c}"></div><div id="bt" style="font-size:20px">Get ready</div></div><div id="bd"></div>`;
 let n=0;const tick=()=>{const inh=n%2===0;ci.style.transform=inh?'scale(1.7)':'scale(1)';bt.textContent=inh?'Breathe in':'Breathe out';n++;if(n>6&&!bd.innerHTML)bd.innerHTML='<button class="btn" id="dn">I feel steadier</button>',dn.onclick=()=>fin('3 slow breaths')};
 setTimeout(tick,300);S.tm=setInterval(tick,4000)},
control(el){const L=[];el.innerHTML=`<input type="text" id="wt" maxlength="24" placeholder="A worry on your mind" aria-label="Worry"><button class="btn sm" id="ad">Add</button><div class="zone"><small>Tap to sort</small><div class="chips" id="z0"></div></div><div class="zone" style="border-color:${E.anx.c}"><small>In my hands</small><div class="chips" id="z1"></div></div><div class="zone"><small>Out of my hands</small><div class="chips" id="z2"></div></div><button class="btn" id="dn" disabled>Done sorting</button>`;
 const draw=()=>{[0,1,2].forEach(i=>q('z'+i).innerHTML='');L.forEach((o,j)=>{const b=document.createElement('button');b.className='chip';b.textContent=o.t;b.onclick=()=>{o.z=o.z===1?2:1;draw()};q('z'+o.z).appendChild(b)});dn.disabled=!L.some(o=>o.z)};
 const put=()=>{const v=wt.value.trim();if(!v||L.length>=6)return;L.push({t:v,z:0});wt.value='';draw()};ad.onclick=put;wt.onkeydown=e=>{if(e.key==='Enter')put()};
 dn.onclick=()=>fin(L.filter(o=>o.z===1).length+' in my hands, '+L.filter(o=>o.z===2).length+' out of my hands')},
scribble(el){el.innerHTML=`<canvas id="cv" width="380" height="260" aria-label="Drawing area"></canvas><button class="btn sm" id="dn" style="background:${E.angry.c}">Done</button><button class="btn sm" id="cl" style="background:var(--card);color:var(--ink)">Clear</button>`;
 const c=cv.getContext('2d');c.lineCap='round';c.lineJoin='round';c.strokeStyle=E.angry.c;let p=null,drawn=false;
 const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*380/r.width,(e.clientY-r.top)*260/r.height]};
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);p=xy(e)};
 cv.onpointermove=e=>{if(!p)return;const n=xy(e),d=Math.hypot(n[0]-p[0],n[1]-p[1]);c.lineWidth=Math.max(3,16-d*.6);c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(n[0],n[1]);c.stroke();p=n;drawn=true};
 cv.onpointerup=cv.onpointercancel=()=>p=null;
 cl.onclick=()=>{c.clearRect(0,0,380,260);drawn=false};
 dn.onclick=()=>fin(drawn?'Free scribble':'Quiet moment',drawn?cv.toDataURL():null)},
comfort(el){const o=['Drink a glass of water','Listen to one song','Stretch for 30 seconds','Step outside for a minute','Text someone kind'].slice(0,S.energy<34?3:5);
 el.innerHTML=o.map((t,i)=>`<button class="opt" data-i="${i}">${t}</button>`).join('');
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>fin(o[+b.dataset.i]))},
savor(el){const o=['People','Good food','Music','Sunshine','A small win','Rest','Movement','A surprise'],s=new Set();
 el.innerHTML=`<div class="chips">${o.map(t=>`<button class="chip" aria-pressed="false">${t}</button>`).join('')}</div><button class="btn" id="dn" disabled>Keep these</button>`;
 el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=b.textContent;s.has(t)?s.delete(t):s.add(t);b.setAttribute('aria-pressed',s.has(t));dn.disabled=!s.size});
 dn.onclick=()=>fin([...s].join(', '))}};
function songDet(o){const g=o.song;return `<div class="r" style="margin-top:14px"><div class="vin" style="--c:${E[o.emo].c}"></div><div><b style="font-size:17px">${esc(g.t)}</b><small>${esc(g.a||'Unknown artist')}${g.l?' · listened '+g.l+'×':''}</small></div></div>${g.m?`<p style="margin:10px 0 0;color:var(--ink)">“${esc(g.m)}”</p>`:''}`}
function cupDet(c){return `<div class="r" style="margin-top:14px;align-items:flex-start"><div class="cupw s"><div class="cup s">${c.items.map(o=>`<div class="lay" style="background:${E[o.e].c}"></div>`).join('')}</div></div><div style="flex:1;font-size:14px"><b style="font-size:15px">Cup of feelings</b><ul class="li">${c.items.map(o=>`<li><span class="dt" style="background:${E[o.e].c}"></span>${esc(o.t)}</li>`).join('')}</ul>${c.ideas.length?`<b style="font-size:15px">Ways I'd empty it</b><ul class="li">${c.ideas.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}</div></div>`}
function archive(){
 const n=S.days.length,o=S.open!==null?S.days[S.open]:null;
 let d='';
 if(o)d=`<div class="det pop"><div class="r">${o.now?ch(o.emo).replace('<svg','<svg class="c"')+'<span style="font-size:26px">→</span>'+ch(o.now).replace('<svg','<svg class="c"'):ch(o.emo).replace('<svg','<svg class="c"')}<div><b>Day ${S.open+1} · ${E[o.emo].n}</b><small>${AN[o.act]} · Energy ${lab(o.e).toLowerCase()}${o.base!=null?' · Self check-in: '+TIER[o.base].h:''}</small></div></div><p style="margin:12px 0 0;color:var(--ink)">${esc(o.detail)}${o.note?'<br>“'+esc(o.note)+'”':''}</p>${o.burn?'<div class="note" style="margin-top:14px">🔥 Torn up and burned. Nothing was saved, by design.</div>':''}${o.song?songDet(o):''}${o.cup?cupDet(o.cup):''}${o.img?`<img src="${o.img}" alt="Your scribble">`:''}${o.now?`<p style="margin:10px 0 0">Then ${E[o.emo].n.toLowerCase()}, now ${E[o.now].n.toLowerCase()}.</p>`:`<p style="margin:12px 0 4px">How does it feel to look back?</p><div class="chips">${Object.keys(E).map(k=>`<button class="chip" data-k="${k}">${E[k].n}</button>`).join('')}</div>`}</div>`;
 $.innerHTML=`<div class="brand">NooK</div><h1>Your archive</h1><p>${n} of 30 days collected. Tap one to step back into that day.</p><div class="arch">${Array.from({length:30},(_,i)=>{const x=S.days[i];return x?`<button class="cell on ${S.open===i?'sel':''}" data-i="${i}" aria-label="Day ${i+1}, ${E[x.emo].n}">${trace(x.emo,i+1)}</button>`:`<div class="cell">${i+1}</div>`}).join('')}</div>${d||'<p>Your finished days collect here.</p>'}`;
 document.querySelectorAll('.cell.on').forEach(b=>b.onclick=()=>{S.open=+b.dataset.i;render()});
 document.querySelectorAll('.det .chip').forEach(b=>b.onclick=()=>{o.now=b.dataset.k;render()})}
render();
</script>
</body>
</html>
