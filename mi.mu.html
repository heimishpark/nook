.mimu{width:var(--cloud);aspect-ratio:1060/850;margin-top:6px;padding:0;border-radius:40%;transform-origin:50% 88%;animation:breathe 4.2s ease-in-out infinite;transition:width .4s}
.mimu img{display:block;width:100%;height:100%;pointer-events:none}
.mimu.wobble{animation:wobble 1.1s ease-in-out}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.012,.986)}}
@keyframes wobble{0%{transform:rotate(0)}22%{transform:rotate(-3.2deg) scale(1.01,.99)}50%{transform:rotate(2.6deg)}78%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}}
.view{display:none}.view.on{display:block}

.card{background:var(--glass);border-radius:28px;padding:20px;margin-top:20px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.card h3{font-size:19px;font-weight:800;letter-spacing:-.3px}

/* home */
.mood-title{font-size:20px;font-weight:900;letter-spacing:-.6px;margin:16px 0 12px}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mood{height:48px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 2px;border-radius:30px;font-size:11px;font-weight:900;background:var(--glass);
  box-shadow:3px 6px 10px rgba(70,60,140,.12),inset 1px 2px 1px rgba(255,255,255,.7);transition:transform .2s,background .2s}
.mood .emoji{font-size:17px}
.mood.active{background:rgba(255,255,255,.85);outline:2px solid rgba(90,70,150,.7);outline-offset:2px;transform:translateY(-2px)}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;gap:4px}
.section-pill{padding:8px 17px;min-width:128px;border-radius:25px;font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);box-shadow:3px 5px 9px rgba(70,60,140,.12),inset 0 1px 1px rgba(255,255,255,.8)}
.section-sub{font-size:9px;font-weight:900;letter-spacing:1.3px;color:var(--ink2);text-align:right}
.cards{display:grid;gap:9px}.cards.one{grid-template-columns:1fr}.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tool-card{display:block;width:100%;padding:0;text-align:left;border-radius:28px;overflow:hidden;background:var(--glass);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .2s}
.tool-card:active{transform:scale(.97)}
.tile{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;height:132px;isolation:isolate;background:linear-gradient(155deg,rgba(255,255,255,.5),rgba(255,255,255,.12))}
.cards.one .tile{height:148px}
.tile:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 24%,rgba(255,255,255,.6) 0,transparent 60%);z-index:-1}
.tile .obj{pointer-events:none;flex-shrink:0}
.card-foot{height:44px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px;letter-spacing:-.35px}
.arrow{height:24px;width:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.7);font-size:18px;line-height:1}
/* keycap thumbnail (from Lesstress) */
.obj-key{position:relative;width:168px;height:158px;filter:drop-shadow(9px 16px 12px #8e688861);transform:scale(.72)}
.key-base{position:absolute;inset:35px 10px 0;border-radius:29px 32px 27px 26px;background:linear-gradient(125deg,#aa8bba,#e8b6d6 63%,#b68aaf);transform:skewY(-5deg);box-shadow:inset -9px -10px 11px #845d9d65}
.key-top{position:absolute;inset:1px 9px 30px 7px;border-radius:27px 31px 31px 31px;transform:perspective(260px) rotateX(13deg) rotateZ(-7deg);background:linear-gradient(138deg,#fff3fc 2%,#e4d1f2 35%,#c6addb 84%,#aa8fbb);box-shadow:inset 5px 6px 9px #ffffffcd,inset -5px -6px 11px #a07cad85,0 6px 2px #9476a5}
.key-top:after{content:'✳';position:absolute;top:29px;left:58px;color:#9473a4;font-size:36px;text-shadow:1px 2px #ffffff9e}
/* bowl thumbnail */
.obj-bowl{position:relative;width:245px;height:220px;filter:drop-shadow(4px 18px 12px #80606c6b);transform:scale(.5);margin:-20px 0}
.bowl-cushion{position:absolute;bottom:4px;left:25px;width:195px;height:50px;border-radius:50%;background:linear-gradient(150deg,#bd819e,#a36e92);box-shadow:inset 3px 8px 10px #efd1df7a,inset -5px -8px 9px #784d7463}
.bowl-shell{position:absolute;left:21px;top:63px;width:204px;height:131px;border-radius:13% 13% 49% 49% / 15% 15% 82% 82%;background:repeating-radial-gradient(ellipse at 45% 40%,transparent 0 8px,#ffdf8850 9px 10px,transparent 11px 17px),linear-gradient(100deg,#744a20,#edb45e 24%,#a7652e 48%,#f9cb77 68%,#85511f 100%);box-shadow:inset -12px -15px 13px #6539148f,inset 7px 4px 9px #fff5ab91}
.bowl-rim{position:absolute;left:20px;top:59px;width:206px;height:61px;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#4f2d19 0%,#795024 64%,#eec37b 67%,#97612a 75%,#f8da94 82%,#7c4d24 100%);box-shadow:0 4px 5px #77441a7d}
/* beads thumbnail */
.obj-beads{position:relative;width:240px;height:248px;transform:scale(.52);margin:-50px 0}
.obj-beads .bead-string{position:absolute;left:29px;top:18px;width:182px;height:194px;border:4px solid #b3a1aa;border-radius:48% 48% 50% 50%/42% 42% 58% 58%;opacity:.6;box-shadow:inset 0 0 0 2px #efe6ea}
.obj-beads .tassel{position:absolute;left:183px;top:178px;width:22px;height:52px;background:linear-gradient(#b88ea9,#8e6b98);clip-path:polygon(35% 0,65% 0,100% 18%,82% 100%,18% 100%,0 18%);border-radius:0 0 10px 10px}
.obj-beads .bead{position:absolute;width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 34% 26%,#fff5f1 0,#e7c5b8 30%,#c79c95 62%,#a98185 100%);box-shadow:inset 4px 4px 5px #fff9,inset -5px -6px 7px #936e7640,0 5px 8px #7d5d6c35}
.obj-beads .bead:nth-child(4n){background:radial-gradient(circle at 34% 26%,#fff9f7 0,#e2c8dc 28%,#c29dbc 64%,#9f7ea3 100%)}



/* today */
.datepill{margin:22px 0 0;height:50px;border-radius:999px;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-shadow:var(--shadow)}
.datepill .lbl{display:flex;align-items:baseline;gap:10px;font-weight:800}.datepill .lbl b{font-size:19px}.datepill .lbl span{font-size:12px;font-weight:700;color:var(--ink2)}
.tri{width:30px;height:30px;display:grid;place-items:center;font-size:15px;color:var(--ink)}.tri:disabled{opacity:.25;cursor:default}
.tp{display:flex;align-items:center;justify-content:space-between;gap:12px}
.total{font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin-top:12px}.total small{font-size:24px;font-weight:700;letter-spacing:-.5px;margin:0 6px 0 2px}
.delta{font-size:13px;font-weight:700;color:var(--ink2);margin-top:2px}
.donut{width:116px;height:116px;flex-shrink:0}
.chart{display:flex;gap:8px;margin-top:22px}
.yl{display:flex;flex-direction:column;justify-content:space-between;height:108px;font-size:11px;font-weight:800;color:var(--ink2);text-align:left;width:40px}
.bars{display:flex;align-items:flex-end;gap:3px;flex:1;height:108px}
.bars i{flex:1;border-radius:4px;background:#d9d6dc;min-height:4px;transition:height .4s}
.bars i.hi{background:linear-gradient(#b48be0,#7a52a3)}.bars i.mid{background:#efb6e6}
.xl{display:flex;justify-content:space-between;margin:6px 0 0 48px;font-size:10px;font-weight:800;color:var(--ink2)}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:16px;font-weight:800;font-size:15px}
.act em{font-style:normal;font-size:13px;color:var(--ink2)}
.act .track{grid-column:1/3;height:8px;border-radius:99px;background:rgba(122,82,163,.14);overflow:hidden}.act .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b48be0,#7a52a3)}
.insight{display:flex;gap:16px;align-items:center;padding:16px 20px 16px 16px}
.insight .av{width:66px;height:66px;border-radius:50%;background:#fff;flex-shrink:0;display:grid;place-items:center;overflow:hidden}.insight .av img{width:120%}
.insight small{display:block;font-size:14px;font-weight:700;color:var(--ink2)}.insight p{font-size:14px;font-weight:700;line-height:1.35;color:var(--ink2);margin-top:2px}

/* my */
.hello{text-align:center;font-size:23px;font-weight:800;color:#15101f;margin-top:8px;letter-spacing:-.4px}
.lv{min-height:150px}.lv .n{font-size:22px;font-weight:900;color:#8f80f0;letter-spacing:-.3px;padding-left:4px}
.xp{height:10px;border-radius:99px;background:rgba(143,128,240,.18);margin:16px 4px 18px;overflow:hidden}.xp i{display:block;width:62%;height:100%;border-radius:99px;background:linear-gradient(90deg,#c6b8ff,#8f80f0)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 4px}.stat{background:rgba(255,255,255,.7);border-radius:20px;padding:12px 14px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px}.stat span{font-size:11px;font-weight:700;color:var(--ink2)}

/* keycap page */
.keypage{position:absolute;inset:0;z-index:6;display:none}
.stage[data-view=key] .keypage{display:block}.stage[data-view=key] .scroll{display:none}
.kp-top{position:absolute;left:24px;right:24px;top:calc(max(env(safe-area-inset-top,0px),22px) + 26px)}
.kp-logo{display:block;width:90px;aspect-ratio:520/144;background:#f7b7d2;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.lvbar{margin-top:18px;height:48px;border-radius:24px;background:rgba(255,255,255,.3);display:flex;align-items:center;gap:12px;padding:0 8px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lvpill{height:32px;min-width:68px;padding:0 16px;border-radius:16px;background:#f3b4cd;color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center}
.track{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.72);overflow:hidden;margin-right:6px}.track i{display:block;height:100%;width:18%;border-radius:5px;background:#f5aecb;transition:width .3s}
.kp-frame{position:absolute;left:0;width:100%;top:176px;bottom:176px;height:auto;border:0;background:transparent}
.kp-keys{position:absolute;left:24px;right:24px;bottom:calc(112px + env(safe-area-inset-bottom,0px));display:flex;gap:12px}
.kp-keys button{flex:1;height:48px;border-radius:14px;background:#e8b4cc;color:#fff;font-weight:800;font-size:15px;transition:background .2s,box-shadow .2s}
.kp-keys button[aria-pressed=true]{background:#e59ec0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.bottom-nav{position:absolute;z-index:10;left:0;right:0;bottom:0;height:calc(86px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-start;
  padding:10px 24px 0;background:rgba(255,255,255,.88);border-radius:30px 30px 0 0;box-shadow:0 -6px 30px rgba(110,70,160,.1);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.nav-item{flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:12px;font-weight:800;color:var(--ink);opacity:.45;transition:opacity .2s}
.nav-item.active{opacity:1}
.nav-item svg{width:34px;height:34px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stage[data-view=home] .nav-item{color:#4a3b6e}

.ritual{position:absolute;inset:0;z-index:30;display:none;background:#f3eee9}
.ritual.open{display:block}
.ritual iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#f3eee9}
.back{position:absolute;z-index:31;top:calc(max(env(safe-area-inset-top,0px),0px) + 96px);right:16px;width:39px;height:39px;border-radius:50%;font-size:23px;line-height:1;
  background:rgba(255,253,245,.94);border:1px solid #e2d7dc;box-shadow:0 4px 20px rgba(72,48,59,.14);display:none}
.ritual.open ~ .back{display:block}



</style>

  $$('.tool-card').forEach(function(c){c.addEventListener('click',function(){c.dataset.tool==='keycap'?show('key'):open(c.dataset.tool)})});
  back.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ritual.classList.contains('open'))close()});

  // sample usage data (seeded per day)
  var prof=[1,1,1,1,1,3,3,4,6,8,7,6,8,7,6,12,22,38,44,40,30,10,4,2];
  function rnd(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
  function dayKey(off){return Math.floor(Date.now()/864e5)+off}
  function bars(off){var k=dayKey(off);return prof.map(function(p,i){return Math.min(58,Math.round(p*.75*(.2+rnd(k*31+i)*1.3)))})}
  function sum(a){return a.reduce(function(x,y){return x+y},0)}
  function hm(m){return Math.floor(m/60)+'<small>h</small>'+(m%60)+'<small>min</small>'}
  var off=0;
  function renderToday(){
    var b=bars(off),t=sum(b),y=sum(bars(off-1)),dt=new Date(Date.now()+off*864e5);
    $('#dl').textContent=off===0?'Today':off===-1?'Yesterday':dt.toLocaleDateString('en-US',{weekday:'long'});
    $('#ds').textContent=dt.toLocaleDateString('en-US',{month:'short',day:'numeric',weekday:'short'});
    $('#next').disabled=off>=0;
    $('#tot').innerHTML=hm(t);var df=t-y;$('#dlt').textContent=(df>=0?'+':'−')+Math.abs(df)+' min from '+(off===0?'yesterday':'the day before');
    var sorted=b.slice().sort(function(x,y){return y-x}),th1=sorted[2],th2=sorted[7];
    $('#bars').innerHTML=b.map(function(v){return '<i class="'+(v>=th1?'hi':v>=th2?'mid':'')+'" style="height:'+Math.max(4,v/60*100)+'%"></i>'}).join('');
    var w=[rnd(dayKey(off)+1)+.6,rnd(dayKey(off)+2)+.4,rnd(dayKey(off)+3)+.3],ws=sum(w),mins=w.map(function(x){return Math.round(t*x/ws)}),
        names=['Keycap','Singing Bowl','Mindful Beads'],cols=['#7a52a3','#b48be0','#f0b4e0'];
    var ord=[0,1,2].sort(function(i,j){return mins[j]-mins[i]});
    $('#acts').innerHTML=ord.map(function(i){return '<div class="act"><span>'+names[i]+'</span><em>'+mins[i]+' min</em><div class="track"><i style="width:'+Math.round(mins[i]/mins[ord[0]]*100)+'%"></i></div></div>'}).join('');
    var c=2*Math.PI*44,acc=0;
    $('#donut').innerHTML='<circle cx="58" cy="58" r="44" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="18"/>'+mins.map(function(m,i){var l=m/t*c,s='<circle cx="58" cy="58" r="44" fill="none" stroke="'+cols[i]+'" stroke-width="18" stroke-dasharray="'+Math.max(0,l-2)+' '+(c-l+2)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 58 58)"/>';acc+=l;return s}).join('');
    var pk=b.indexOf(Math.max.apply(null,b)),h=(pk+1)%24,p=h>=5&&h<12?'morning':h>=12&&h<17?'afternoon':h>=17&&h<22?'evening':'night';
    $('#ins').textContent='You played the most in the '+p+', which helped release your stress.';
  }
  $('#prev').addEventListener('click',function(){off--;renderToday()});
  $('#next').addEventListener('click',function(){if(off<0){off++;renderToday()}});
  function renderMy(){syncLv();var t=0;for(var i=0;i>-7;i--)t+=sum(bars(i));$('#s1').innerHTML=hm(t);$('#s2').textContent=24+Math.round(rnd(dayKey(0))*6)}
})();
</script>
</body>
</html>
